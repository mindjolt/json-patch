apply plugin: 'java'
apply plugin: 'maven-publish'

group = 'com.tananaev'
version = '1.3'

sourceCompatibility = 1.7

repositories {
    jcenter()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.7'
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/mindjolt/java-packages")
            credentials {
                username = project.findProperty("ghUser") ?: System.getenv("GH_USER")
                password = project.findProperty("ghPat") ?: System.getenv("GH_PAT")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
            pom {
                name = 'json-patch'
                packaging = 'jar'
                description = 'A Gson-based JSON patch standard implementation.'
                url = 'https://github.com/tananaev/json-patch'
                scm {
                    connection = 'scm:git:https://github.com/tananaev/json-patch'
                    developerConnection = 'scm:git:git@github.com:tananaev/json-patch.git'
                    url = 'https://github.com/tananaev/json-patch'
                }
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'tananaev'
                        name = 'Anton Tananaev'
                        email = 'anton.tananaev@gmail.com'
                    }
                }
            }
        }
    }
}
